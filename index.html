<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>종합 뉴스</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>종합 뉴스</h1>
    <button onclick="toggleDarkMode()" style="position:fixed;top:10px;right:10px;">🌙/☀️</button>
    <nav>
    
      <!-- <a href="left.html">좌파 뉴스</a>
      <a href="neutral.html">중립 뉴스</a>
      <a href="right.html">우파 뉴스</a> -->
    </nav>
  </header>

  <main>
    <section class="author-opinion" id="author-opinion"></section>
  
    <div class="news-grid">
      <section class="left">
        <div id="left-news" class="news-list"></div>
      </section>
  
      <section class="neutral">
        <div id="neutral-news" class="news-list"></div>
      </section>
  
      <section class="right">
        <div id="right-news" class="news-list"></div>
      </section>
    </div>
  </main>
  
  

  <footer>
    <p>&copy; 2025 종합 뉴스</p>
  </footer>

  <script>
  function loadNews(rssUrl, elementId) {
    const url = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
    fetch(url)
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById(elementId);
        data.items.slice(0, 3).forEach(item => {
          // 가능한 썸네일 이미지 추출 순서: thumbnail > media:content > media:thumbnail
          let thumbnail = item.thumbnail || 
                          (item['media:content'] && item['media:content'].url) ||
                          (item['media:thumbnail'] && item['media:thumbnail'].url) || null;

          const div = document.createElement('div');
          div.className = 'news-item';

          // 이미지 태그 조건부 생성
          const imageTag = thumbnail 
            ? `<img src="${thumbnail}" alt="썸네일">` 
            : '';

          div.innerHTML = `
            <a href="${item.link}" target="_blank">
              ${imageTag}
              <div class="news-text">
                <h3>${item.title}</h3>
                <p>${(item.content || item.description).slice(0, 300)}...</p>
              </div>
            </a>
          `;
          container.appendChild(div);
        });
      });
  }

  // 좌파
  loadNews("https://www.yna.co.kr/rss/politics.xml", "left-news");
  loadNews("https://www.khan.co.kr/rss/rssdata/politic_news.xml", "left-news");

  // 중립
  loadNews("https://www.yna.co.kr/rss/politics.xml", "neutral-news");
  // loadNews("https://api.newswire.co.kr/rss/industry/1400", "neutral-news");
  loadNews("https://news.sbs.co.kr/news/SectionRssFeed.do?sectionId=01&plink=RSSREADER", "neutral-news");
  loadNews("https://www.korea.kr/rss/archive.xml", "neutral-news");

  // 우파
  loadNews("https://www.chosun.com/arc/outboundfeeds/rss/category/politics/?outputType=xml", "right-news");
  // loadNews("https://www.joongang.co.kr/rss/news.xml", "right-news");
  loadNews("https://rss.donga.com/politics.xml", "right-news");
  function toggleDarkMode() {
  document.body.classList.toggle('dark');
  }
  // 처음 페이지 로드 시: 시스템 설정 + 로컬 저장값 확인
  window.onload = function () {
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      document.body.classList.add('dark');
    }
  }

  // 수동 토글 버튼
  function toggleDarkMode() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  }
  function loadOpinion(filePath) {
  fetch(filePath)
    .then(res => res.text())
    .then(text => {
      document.getElementById("author-opinion").textContent = text;
    })
    .catch(err => {
      console.error("글쓴이의 생각 불러오기 실패:", err);
    });
}

  loadOpinion("author-opinion.txt");
   
  </script>
</body>
</html>
