<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>종합 뉴스</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>종합 뉴스</h1>
    <nav>
      <!-- <a href="left.html">좌파 뉴스</a>
      <a href="neutral.html">중립 뉴스</a>
      <a href="right.html">우파 뉴스</a> -->
    </nav>
  </header>

  <main class="news-grid">
    <section class="left">
      <div id="left-news" class="news-list"></div>
    </section>

    <section class="neutral">
      <div id="neutral-news" class="news-list"></div>
    </section>

    <section class="right">
      <div id="right-news" class="news-list"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 종합 뉴스</p>
  </footer>

  <script>
  function loadNews(rssUrl, elementId) {
    const url = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
    fetch(url)
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById(elementId);
        data.items.slice(0, 5).forEach(item => {
          // <media:thumbnail> 또는 <media:content>에서 썸네일 URL 추출
          const thumbnail = item['media:thumbnail'] ? item['media:thumbnail'].url : 
                            (item['media:content'] ? item['media:content'].url : 'https://via.placeholder.com/100');

          const div = document.createElement('div');
          div.className = 'news-item';
          div.innerHTML = `
            <a href="${item.link}" target="_blank" class="news-card">
              <img src="${thumbnail}" alt="썸네일" class="news-img">
              <div class="news-info">
                <h3 class="news-title">${item.title}</h3>
                <p class="news-meta">
                  <span>${new Date(item.pubDate).toLocaleDateString()}</span>
                  <span class="news-source">${item.author || "언론사 미상"}</span>
                </p>
                <p class="news-desc">${item.description.slice(0, 100)}...</p>
              </div>
            </a>
          `;
          container.appendChild(div);
        });
      });
  }
  // 좌파
  loadNews("https://www.yna.co.kr/rss/politics.xml", "left-news");
  loadNews("https://www.khan.co.kr/rss/rssdata/politic_news.xml", "left-news");

  // 중립
  loadNews("https://www.yna.co.kr/rss/politics.xml", "neutral-news");
  // loadNews("https://api.newswire.co.kr/rss/industry/1400", "neutral-news");
  loadNews("https://news.sbs.co.kr/news/SectionRssFeed.do?sectionId=01&plink=RSSREADER", "neutral-news");
  loadNews("https://www.korea.kr/rss/archive.xml", "neutral-news");

  // 우파
  loadNews("https://www.chosun.com/arc/outboundfeeds/rss/category/politics/?outputType=xml", "right-news");
  // loadNews("https://www.joongang.co.kr/rss/news.xml", "right-news");
  loadNews("https://rss.donga.com/politics.xml", "right-news");
  </script>
</body>
</html>
