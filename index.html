<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>종합 뉴스</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>종합 뉴스</h1>
    <nav>
      <a href="left.html">좌파 뉴스</a>
      <a href="neutral.html">중립 뉴스</a>
      <a href="right.html">우파 뉴스</a>
    </nav>
  </header>

  <main class="news-grid">
    <section class="left">
      <div id="left-news" class="news-list"></div>
    </section>

    <section class="neutral">
      <div id="neutral-news" class="news-list"></div>
    </section>

    <section class="right">
      <div id="right-news" class="news-list"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 종합 뉴스</p>
  </footer>

  <script>
  function loadNews(rssUrl, elementId) {
    const url = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
    fetch(url)
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById(elementId);
        data.items.slice(0, 5).forEach(item => {
          const div = document.createElement('div');
          div.className = 'news-item';
          div.innerHTML = `
            <a href="${item.link}" target="_blank" class="news-card">
              <img src="${item.thumbnail || 'https://via.placeholder.com/120'}" alt="썸네일" class="news-img">
              <div class="news-info">
                <h3 class="news-title">${item.title}</h3>
                <p class="news-meta">
                  <span>${new Date(item.pubDate).toLocaleDateString()}</span>
                  <span class="news-source">${item.author || "언론사 미상"}</span>
                </p>
                <p class="news-desc">${item.description.slice(0, 100)}...</p>
              </div>
            </a>
          `;
          container.appendChild(div);
        });
      });
  }
  // 좌파
  loadNews("http://www.hani.co.kr/rss/", "left-news");
  loadNews("https://www.khan.co.kr/rss/rssdata/politic_news.xml", "left-news");

  // 중립
  loadNews("https://www.yna.co.kr/rss/all01.xml", "neutral-news");
  loadNews("https://www.news1.kr/rss/rss.xml", "neutral-news");
  loadNews("http://news.kbs.co.kr/rss/rss.xml?cat=politics", "neutral-news");

  // 우파
  loadNews("http://rss.chosun.com/rss/www_section01.xml", "right-news");
  loadNews("https://www.joongang.co.kr/rss/news.xml", "right-news");
  loadNews("https://rss.donga.com/total.xml", "right-news");
  </script>
</body>
</html>
